name: PixelPress – APK bauen

on:
  push:
    branches: [pixelpress]
    paths: ["pixelpress/**", ".github/workflows/pixelpress-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixelpress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android-Plattform 37 installieren
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          PKG=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -uV | tail -1)
          echo "Gewählt: $PKG"
          test -n "$PKG"
          sdkmanager "$PKG" "build-tools;37.0.0" || sdkmanager "$PKG"
      - name: Tests des Kerns
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain --stacktrace 2>&1 | grep -vE '^\s+at (org\.gradle|java\.|jdk\.|kotlin\.)'
      - name: APK bauen
        run: ./gradlew assembleDebug --console=plain
      - name: Lint (nicht abbrechend)
        continue-on-error: true
        run: ./gradlew lint --console=plain
      - name: APK umbenennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PixelPress-${VERSION}-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPress-debug-apk
          path: pixelpress/dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berichte
          path: |
            pixelpress/app/build/reports
            pixelpress/app/build/outputs/lint-results-debug.*
          if-no-files-found: ignore
