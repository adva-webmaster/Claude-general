name: PixelSweeper – APK bauen

on:
  push:
    branches: [fotosortierer]
    paths: ["fotosortierer/**", ".github/workflows/fotosortierer-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fotosortierer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android-Plattform 37 installieren
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          echo "Verfügbare Plattformen ab 36:"
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u || true
          PKG=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-37[0-9.]*" | sort -uV | tail -1)
          echo "Gewählt: $PKG"
          test -n "$PKG"
          sdkmanager "$PKG" "build-tools;37.0.0" || sdkmanager "$PKG"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: APK bauen
        run: ./gradlew assembleDebug --console=plain
      - name: Tests (nicht abbrechend)
        continue-on-error: true
        run: ./gradlew test --console=plain
      - name: Lint (nicht abbrechend)
        continue-on-error: true
        run: ./gradlew lint --console=plain
      - name: Lint-Ergebnis anzeigen
        if: always()
        run: |
          f=$(find app/build -name 'lint-results-debug.txt' | head -1)
          echo "Datei: $f"
          [ -n "$f" ] && sed -n '1,400p' "$f" || true
      - name: APK umbenennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/PixelSweeper-${VERSION}-debug.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: PixelSweeper-debug-apk
          path: fotosortierer/dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berichte
          path: |
            fotosortierer/app/build/reports
            fotosortierer/app/build/outputs/lint-results-debug.*
          if-no-files-found: ignore
