name: Fotosortierer – APK bauen

on:
  push:
    branches: [claude/marlons-sternenreise-game-v4g9y0]
    paths: ["fotosortierer/**", ".github/workflows/fotosortierer-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fotosortierer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android-Plattform installieren (37, ersatzweise 36)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          if sdkmanager "platforms;android-37" "build-tools;37.0.0"; then
            echo "API 37 installiert"
          else
            echo "API 37 nicht verfügbar, nehme 36"
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          fi
      - name: APK bauen
        run: ./gradlew assembleDebug --console=plain
      - name: Tests (nicht abbrechend)
        continue-on-error: true
        run: ./gradlew test --console=plain
      - name: Lint (nicht abbrechend)
        continue-on-error: true
        run: ./gradlew lint --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: fotosortierer-debug-apk
          path: fotosortierer/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berichte
          path: |
            fotosortierer/app/build/reports
            fotosortierer/app/build/outputs/lint-results-debug.*
          if-no-files-found: ignore
